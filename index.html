<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Titkos küldetés Tominak és Ildikónak">
<meta name="theme-color" content="#0f7d76">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tomi és Ildikó küldetése</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: egyetlen középre tett "fürdőjegy" kártya, fölötte gőzbuborék-haladásjelző; termálvíz-türkiz + törölközőfehér + szülinapi korall */
:root {
  --bg: #e7f1ef;
  --bg-deep: #cfe5e1;
  --card: #fbfdfc;
  --ink: #12302f;
  --muted: #557370;
  --line: #c3d9d5;
  --thermal: #0f7d76;
  --thermal-ink: #ffffff;
  --coral: #e5603f;
  --coral-soft: #fbe2d9;
  --gold: #d9a531;
  --ok: #2c8a4f;
  --err: #c2412a;
  --tile: #ffffff;
  --shadow: 0 1px 2px rgba(18,48,47,.06), 0 12px 32px -12px rgba(18,48,47,.22);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1d1d; --bg-deep: #0a2a29; --card: #132a2a; --ink: #e4f1ee; --muted: #93b3ae;
    --line: #24413f; --thermal: #3cbfb3; --thermal-ink: #062120; --coral: #ff8a6a; --coral-soft: #3a2420;
    --gold: #f0c35a; --ok: #5fcf88; --err: #ff8a72; --tile: #1a3534;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1d1d; --bg-deep: #0a2a29; --card: #132a2a; --ink: #e4f1ee; --muted: #93b3ae;
  --line: #24413f; --thermal: #3cbfb3; --thermal-ink: #062120; --coral: #ff8a6a; --coral-soft: #3a2420;
  --gold: #f0c35a; --ok: #5fcf88; --err: #ff8a72; --tile: #1a3534;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -14px rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: radial-gradient(120% 60% at 50% 0%, var(--bg-deep), var(--bg) 70%) fixed, var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 1.0625rem;
  line-height: 1.55;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 620px; margin: 0 auto; display: grid; gap: 20px; }

/* steam-bubble progress */
.progress { display: flex; align-items: center; justify-content: center; gap: 10px; }
.bubble {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid var(--thermal); background: transparent;
  transition: background .3s, transform .3s;
}
.bubble.done { background: var(--thermal); }
.bubble.now { transform: scale(1.35); background: var(--coral); border-color: var(--coral); }
.progress-label { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: center; }

.card {
  background: var(--card);
  border-radius: 22px;
  box-shadow: var(--shadow);
  padding: clamp(22px, 5vw, 36px);
  position: relative;
  overflow: hidden;
}
.stage { display: grid; gap: 18px; animation: rise .45s ease both; }
@keyframes rise { from { transform: translateY(10px); } to { transform: none; } }

.eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--coral); }
h1, h2 { font-family: var(--display); margin: 0; line-height: 1.08; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: clamp(2rem, 7vw, 2.9rem); font-weight: 800; }
h2 { font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 700; }
p { margin: 0; }
.lead { font-size: 1.1rem; }
.muted { color: var(--muted); }
.agents { display: flex; flex-wrap: wrap; gap: 8px; }
.agent {
  font-size: .85rem; font-weight: 600; padding: 4px 12px 4px 8px; border-radius: 999px;
  background: var(--coral-soft); color: var(--ink); display: inline-flex; align-items: center; gap: 6px;
}
.agent::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); }

.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button, .btn {
  font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 14px;
  padding: 13px 22px; background: var(--thermal); color: var(--thermal-ink);
  transition: transform .15s, filter .15s;
}
button:hover { filter: brightness(1.07); }
button:active { transform: scale(.97); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
button.ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--line); font-weight: 600; }
button.small { padding: 8px 14px; font-size: .9rem; border-radius: 10px; }

.runaway-zone { position: relative; min-height: 64px; }
#runaway { position: absolute; left: 0; top: 0; white-space: nowrap; }
#runaway.moving { transition: left .25s ease, top .25s ease; }

/* letter tiles */
.slots, .tiles { display: flex; gap: 6px; justify-content: center; }
.slot, .tile {
  width: min(46px, calc((100% - 42px) / 8)); aspect-ratio: 46 / 54; height: auto; flex: 0 0 auto;
  border-radius: 10px; display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: clamp(1.05rem, 5vw, 1.5rem); padding: 0;
}
.slot { border: 2px dashed var(--line); background: transparent; color: var(--ink); }
.slot.filled { border-style: solid; border-color: var(--thermal); background: var(--tile); }
.tile { background: var(--tile); color: var(--ink); border: 1.5px solid var(--line); box-shadow: 0 3px 0 var(--line); }
.tile:disabled { opacity: .2; cursor: default; box-shadow: none; }

/* quiz */
.options { display: grid; gap: 10px; }
.opt {
  text-align: left; background: var(--tile); color: var(--ink); border: 1.5px solid var(--line);
  font-weight: 600; display: flex; gap: 12px; align-items: center;
}
.opt b { font-family: var(--display); color: var(--thermal); min-width: 1.2em; }
.opt.wrong { border-color: var(--err); color: var(--err); text-decoration: line-through; opacity: .7; }
.opt.right { border-color: var(--ok); background: var(--ok); color: var(--card); }
.opt.right b { color: var(--card); }

/* rebus */
.rebus {
  display: flex; flex-wrap: wrap; gap: clamp(4px, 1.6vw, 10px); align-items: center; justify-content: center;
  font-family: var(--display); font-weight: 800; font-size: clamp(1.1rem, 4.8vw, 1.8rem);
  padding: 18px 12px; border-radius: 16px; background: var(--bg);
}
.rebus .pic { font-size: clamp(1.8rem, 8vw, 2.4rem); line-height: 1; }
.rebus .op { color: var(--coral); }
.rebus s { color: var(--muted); text-decoration-thickness: 3px; text-decoration-color: var(--coral); }

.answer { display: flex; gap: 10px; flex-wrap: wrap; }
.answer input {
  flex: 1 1 200px; min-width: 0; font: inherit; font-size: 1.15rem; font-weight: 600;
  padding: 12px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--tile); color: var(--ink);
}
.answer input.shake { animation: shake .4s; border-color: var(--err); }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

.feedback { min-height: 1.5em; font-weight: 600; }
.feedback.err { color: var(--err); }
.feedback.ok { color: var(--ok); }
.hint { font-size: .95rem; padding: 12px 14px; border-radius: 12px; background: var(--coral-soft); }

.math {
  font-family: var(--display); font-weight: 700; font-size: 1.25rem; text-align: center;
  padding: 16px; border-radius: 16px; background: var(--bg); font-variant-numeric: tabular-nums;
}

/* voucher + scratch */
.scratch-wrap { position: relative; border-radius: 18px; overflow: hidden; touch-action: none; }
#scratch { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; transition: opacity .6s; }
#scratch.gone { opacity: 0; pointer-events: none; }
.voucher { background: var(--bg); border-radius: 18px; overflow: hidden; display: grid; }
.voucher img { width: 100%; aspect-ratio: 342 / 226; object-fit: cover; display: block; max-width: 100%; }
.voucher-body { padding: 18px 20px 20px; display: grid; gap: 14px; }
.voucher-title { font-family: var(--display); font-weight: 800; font-size: 1.6rem; line-height: 1.1; }
.dates { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 14px; border-top: 1.5px dashed var(--line); }
.dates small { display: block; color: var(--muted); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; }
.dates strong { display: block; font-family: var(--display); font-size: clamp(1rem, 4.4vw, 1.2rem); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dates .day { color: var(--muted); font-size: .9rem; }
.nights { display: inline-block; justify-self: start; font-weight: 700; font-size: .85rem; padding: 4px 12px; border-radius: 999px; background: var(--thermal); color: var(--thermal-ink); }

.after { display: grid; gap: 18px; }
.after[hidden] { display: none !important; }
.packlist { display: grid; gap: 8px; }
.packlist label { display: flex; gap: 10px; align-items: center; cursor: pointer; }
.packlist input { width: 20px; height: 20px; accent-color: var(--thermal); }
.packlist input:checked + span { text-decoration: line-through; color: var(--muted); }
.sign { font-family: var(--display); font-weight: 700; font-size: 1.15rem; }

#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; width: 100%; height: 100%; }
footer { text-align: center; font-size: .85rem; color: var(--muted); }
footer button { background: none; color: var(--muted); text-decoration: underline; padding: 4px; font-weight: 500; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

</main>

  const AGENTS = ["Biu", "Barbi", "Bogi", "Laci", "Gyuri", "Mati"];
  const STEPS = 6; // intro, 4 puzzles, reveal
  const card = document.getElementById("card");
  const progress = document.getElementById("progress");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const store = {
    get() { try { return parseInt(localStorage.getItem("tomi-kuldetes") || "0", 10) || 0; } catch { return 0; } },
    set(v) { try { localStorage.setItem("tomi-kuldetes", String(v)); } catch {} }
  };
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const WRONG = [
    "Nem nyert. A szauna még csak langyos.",
    "Hideg víz! Próbáljátok újra.",
    "Ez nem az. Ildikó, segíts Tominak!",
    "Majdnem. Na jó, nem majdnem.",
    "A titkos ügynökök csalódottan csóválják a fejüket.",
    "Hűha. Ezt még egyszer, lassabban."
  ];

  let step = store.get();
  if (step >= STEPS) step = STEPS - 1;

  function renderProgress() {
    progress.innerHTML = "";
    for (let i = 0; i < STEPS; i++) {
      const b = document.createElement("span");
      b.className = "bubble" + (i < step ? " done" : i === step ? " now" : "");
      progress.appendChild(b);
    }
  }
  function go(n) { step = n; store.set(n); render(); window.scrollTo({ top: 0, behavior: reduced ? "auto" : "smooth" }); }
  function next() { go(step + 1); }
  function html(s) { card.innerHTML = `<div class="stage">${s}</div>`; }
  function label(n) { return `<div class="eyebrow">${n}. feladat a 4-ből</div>`; }

  function wireInput({ answers, onOk, okMsg }) {
    const input = card.querySelector("#ans");
    const fb = card.querySelector(".feedback");
    const form = card.querySelector("form");
    let tries = 0;
    form.addEventListener("submit", e => {
      e.preventDefault();
      const v = norm(input.value);
      if (!v) { fb.className = "feedback err"; fb.textContent = "Üresen nem ér beküldeni."; return; }
      if (answers.some(a => norm(a) === v)) {
        fb.className = "feedback ok"; fb.textContent = okMsg; input.disabled = true;
        form.querySelector("button[type=submit]").disabled = true;
        burst(60); setTimeout(onOk, 1300);
      } else {
        tries++;
        fb.className = "feedback err"; fb.textContent = pick(WRONG);
        input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake");
        if (tries >= 2) card.querySelectorAll(".hint[hidden]").forEach((h, i) => { if (i === 0) h.hidden = false; });
      }
    });
    card.querySelectorAll("[data-hint]").forEach(btn => btn.addEventListener("click", () => {
      const h = card.querySelector(".hint[hidden]"); if (h) h.hidden = false;
      if (!card.querySelector(".hint[hidden]")) btn.hidden = true;
    }));
  }

  /* ---------- 0: intro ---------- */
  function intro() {
    html(`
      <div class="eyebrow">Szigorúan titkos · Csak Tominak és Ildikónak</div>
      <h1>Boldog szülinapot, Tomi!</h1>
      <p class="lead">Hat titkos ügynök elrejtett nektek valamit. Ildikó, te is érintett vagy: ez közös ajándék, úgyhogy közösen kell megfejtenetek.</p>
      <div class="agents">${AGENTS.map(a => `<span class="agent">${a}</span>`).join("")}</div>
      <p class="muted">Négy feladat vár rátok. Mindegyik után közelebb kerültök a meglepetéshez. Ha elakadtok, kérhettek segítséget, nem szólunk senkinek.</p>
      <div class="runaway-zone">
        <div class="row"><button type="button" id="start">Benne vagyunk!</button></div>
        <button type="button" class="ghost" id="runaway">Inkább aludnék</button>
      </div>
    `);
    const zone = card.querySelector(".runaway-zone");
    const start = card.querySelector("#start");
    const run = card.querySelector("#runaway");
    const place = () => {
      const fits = start.offsetWidth + 14 + run.offsetWidth <= zone.clientWidth;
      run.style.left = fits ? (start.offsetWidth + 14) + "px" : "0px";
      run.style.top = fits ? "0px" : "62px";
      zone.style.minHeight = fits ? "64px" : "116px";
    };
    place();
    let dodges = 0;
    const lines = ["Biztos?", "Na ne már!", "Nem fogsz elkapni", "Ez nem opció", "Jó, jó, játsszunk"];
    const dodge = e => {
      if (dodges >= lines.length - 1) return;
      e.preventDefault();
      dodges++;
      run.classList.add("moving");
      zone.style.minHeight = "170px";
      const maxX = Math.max(0, zone.clientWidth - run.offsetWidth);
      run.style.left = Math.round(Math.random() * maxX) + "px";
      run.style.top = Math.round(50 + Math.random() * 60) + "px";
      run.textContent = lines[dodges - 1];
      if (dodges === lines.length - 1) { run.textContent = lines[lines.length - 1]; run.className = "moving"; }
    };
    run.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") dodge(e); });
    run.addEventListener("click", e => { if (dodges >= lines.length - 1) next(); else dodge(e); });
    start.addEventListener("click", next);
  }

  /* ---------- 1: letter tiles ---------- */
  function letters() {
    const WORD = "WELLNESS";
    const pool = ["S", "L", "E", "W", "N", "S", "E", "L"];
    html(`
      ${label(1)}
      <h2>Betűsaláta</h2>
      <p>Az ügynökök szétszórták a meglepetés első nyomát. Rakjátok ki a szót! Ha rossz betűt raktatok le, kattintsatok rá, és visszakerül.</p>
      <div class="slots" id="slots"></div>
      <div class="tiles" id="tiles"></div>
      <div class="row"><button type="button" class="ghost small" id="clear">Előről</button><button type="button" class="ghost small" data-hint>Segítséget kérek</button></div>
      <p class="hint" hidden>Angol szó, nyolc betű. Fürdőköpeny, masszázs, nulla stressz.</p>
      <p class="hint" hidden>W-vel kezdődik, két L és két S van benne.</p>
      <p class="feedback"></p>
    `);
    const slotsEl = card.querySelector("#slots"), tilesEl = card.querySelector("#tiles"), fb = card.querySelector(".feedback");
    let picked = [];
    function draw() {
      slotsEl.innerHTML = ""; tilesEl.innerHTML = "";
      for (let i = 0; i < WORD.length; i++) {
        const s = document.createElement("button");
        s.type = "button"; s.className = "slot" + (picked[i] != null ? " filled" : "");
        s.textContent = picked[i] != null ? pool[picked[i]] : "";
        s.setAttribute("aria-label", picked[i] != null ? `${pool[picked[i]]} visszavétele` : "üres hely");
        s.addEventListener("click", () => { if (picked[i] != null) { picked.splice(i, 1); draw(); } });
        slotsEl.appendChild(s);
      }
      pool.forEach((ch, idx) => {
        const t = document.createElement("button");
        t.type = "button"; t.className = "tile"; t.textContent = ch;
        t.disabled = picked.includes(idx);
        t.addEventListener("click", () => { picked.push(idx); draw(); check(); });
        tilesEl.appendChild(t);
      });
    }
    function check() {
      if (picked.length < WORD.length) { fb.textContent = ""; return; }
      const w = picked.map(i => pool[i]).join("");
      if (w === WORD) {
        fb.className = "feedback ok"; fb.textContent = "WELLNESS! Már érzitek a klórszagot?";
        tilesEl.querySelectorAll("button").forEach(b => b.disabled = true);
        burst(60); setTimeout(next, 1500);
      } else {
        fb.className = "feedback err"; fb.textContent = `„${w}”? ${pick(WRONG)}`;
      }
    }
    card.querySelector("#clear").addEventListener("click", () => { picked = []; fb.textContent = ""; draw(); });
    card.querySelector("[data-hint]").addEventListener("click", e => {
      const h = card.querySelector(".hint[hidden]"); if (h) h.hidden = false;
      if (!card.querySelector(".hint[hidden]")) e.currentTarget.hidden = true;
    });
    draw();
  }

  /* ---------- 2: quiz ---------- */
  function quiz() {
    const opts = [
      { t: "Egy újabb pár zokni, mintás", r: "A zokniszekrény már így is tele van. Próbáljátok újra." },
      { t: "Excel-tábla a családi kiadásokról", r: "Ez inkább büntetés, mint ajándék." },
      { t: "Két nap semmittevés, köntösben, papucsban", ok: true },
      { t: "Önkéntes munka egy költöztetésnél", r: "Ezt Laci is elutasította volna. Nem nyert." }
    ];
    html(`
      ${label(2)}
      <h2>Szakértői kérdés</h2>
      <p>Mire van a legnagyobb szüksége egy frissen ünnepelt Tominak és az ő Ildikójának?</p>
      <div class="options">${opts.map((o, i) => `<button type="button" class="opt" data-i="${i}"><b>${"ABCD"[i]}</b><span>${o.t}</span></button>`).join("")}</div>
      <p class="feedback"></p>
    `);
    const fb = card.querySelector(".feedback");
    card.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      const o = opts[+b.dataset.i];
      if (o.ok) {
        b.classList.add("right"); fb.className = "feedback ok"; fb.textContent = "Pontosan! Köntös, papucs, nulla teendő.";
        card.querySelectorAll(".opt").forEach(x => x.disabled = true);
        burst(60); setTimeout(next, 1500);
      } else {
        b.classList.add("wrong"); b.disabled = true; fb.className = "feedback err"; fb.textContent = o.r;
      }
    }));
  }

  /* ---------- 3: rebus (where) ---------- */
  function rebus() {
    html(`
      ${label(3)}
      <h2>Hová mentek?</h2>
      <p>Egy város rejtőzik a képrejtvényben. Ott van, ahol a nyírfák állnak.</p>
      <div class="rebus" aria-label="Nyírfa, mínusz FA, plusz egy, plusz ház, plusz A">
        <span class="pic">🌳</span><span>NYÍR<s>FA</s></span><span class="op">+</span>
        <span>1</span><span class="op">+</span>
        <span class="pic">🏠</span><span class="op">+</span><span>A</span>
      </div>
      <form class="answer" autocomplete="off">
        <input id="ans" placeholder="A város neve" aria-label="A város neve">
        <button type="submit">Beküldöm</button>
      </form>
      <div class="row"><button type="button" class="ghost small" data-hint>Segítséget kérek</button></div>
      <p class="hint" hidden>A fa neve: nyír. Az 1 betűvel: egy. A kép: ház. Mindez egyben, a végén egy A-val.</p>
      <p class="hint" hidden>Szabolcs-Szatmár-Bereg megye székhelye. Ny-nyel kezdődik.</p>
      <p class="feedback"></p>
    `);
    wireInput({ answers: ["Nyíregyháza", "Nyiregyhaza"], okMsg: "Nyíregyháza! De pontosan hol?", onOk: next });
  }

  /* ---------- 4: when ---------- */
  function when() {
    html(`
      ${label(4)}
      <h2>És mikor?</h2>
      <p>A nap egy kis matekból jön ki. 2027 januárjáról van szó.</p>
      <div class="math">(titkos ügynökök száma × 4) − 1 = január ?.</div>
      <p class="muted">Tipp: az ügynököket a legelső oldalon láttátok.</p>
      <form class="answer" autocomplete="off">
        <input id="ans" inputmode="numeric" placeholder="Hányadika?" aria-label="Január hányadika">
        <button type="submit">Beküldöm</button>
      </form>
      <div class="row"><button type="button" class="ghost small" data-hint>Segítséget kérek</button></div>
      <p class="hint" hidden>Biu, Barbi, Bogi, Laci, Gyuri, Mati: ez hat ügynök.</p>
      <p class="hint" hidden>6 × 4 = 24. Abból még vonjatok le egyet.</p>
      <p class="feedback"></p>
    `);
    wireInput({ answers: ["23", "23.", "huszonharom", "jan23", "januar23"], okMsg: "Január 23., szombat! Jöhet a nagy leleplezés.", onOk: next });
  }

  /* ---------- 5: reveal ---------- */
  function reveal() {
    html(`
      <div class="eyebrow">Utolsó lépés</div>
      <h2>Kaparjátok le!</h2>
      <p>Ujjal vagy egérrel dörzsöljétek le az ezüstöt. Ott van alatta az ajándék.</p>
      <div class="scratch-wrap" id="sw">
        <div class="voucher">
          <img src="${HOTEL_IMG}" alt="A Hunguest Hotel Sóstó épülete fák között">
          <div class="voucher-body">
            <div class="eyebrow">Wellness hétvége kettőtöknek</div>
            <div class="voucher-title">Hunguest Hotel Sóstó</div>
            <p class="muted">Nyíregyháza</p>
            <span class="nights">2 éjszaka</span>
            <div class="dates">
              <div><small>Érkezés</small><strong>2027. jan. 23.</strong><span class="day">szombat</span></div>
              <div><small>Kijelentkezés</small><strong>2027. jan. 25.</strong><span class="day">hétfő</span></div>
            </div>
          </div>
        </div>
        <canvas id="scratch" aria-label="Lekaparható réteg"></canvas>
      </div>
      <div class="row" id="skiprow"><button type="button" class="ghost small" id="skip">Nem bírom kivárni, mutasd!</button></div>
      <div class="after" id="after" hidden>
        <h1>Boldog szülinapot, Tomi!</h1>
        <p class="lead">Ez a születésnapi ajándékod, és közös karácsonyi ajándék nektek. Két nap fürdés, szauna, alvás és semmi rohanás a Sóstó partján.</p>
        <div>
          <p class="eyebrow" style="margin-bottom:8px">Csomagolási lista</p>
          <div class="packlist">
            ${["Fürdőruha", "Papucs", "Jó nagy alvás", "Kikapcsolt telefon", "Egymás"].map((t, i) => `<label for="pk${i}"><input type="checkbox" id="pk${i}"><span>${t}</span></label>`).join("")}
          </div>
        </div>
        <p>Sok szeretettel:</p>
        <p class="sign">${AGENTS.join(", ").replace(/, ([^,]*)$/, " és $1")}</p>
      </div>
    `);
    setupScratch();
  }

  function setupScratch() {
    const wrap = card.querySelector("#sw"), cv = card.querySelector("#scratch"), ctx = cv.getContext("2d");
    const after = card.querySelector("#after"), skip = card.querySelector("#skiprow");
    let done = false, drawing = false, last = null, moves = 0;
    const css = getComputedStyle(document.documentElement);
    function paint() {
      const r = wrap.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const g = ctx.createLinearGradient(0, 0, r.width, r.height);
      g.addColorStop(0, "#b9c4c3"); g.addColorStop(.35, "#eef3f2"); g.addColorStop(.6, "#a7b3b2"); g.addColorStop(1, "#dfe6e5");
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = g; ctx.fillRect(0, 0, r.width, r.height);
      ctx.fillStyle = "rgba(18,48,47,.08)";
      for (let i = 0; i < 400; i++) ctx.fillRect(Math.random() * r.width, Math.random() * r.height, 2, 2);
      ctx.fillStyle = "#30504e"; ctx.textAlign = "center";
      ctx.font = `800 ${Math.min(34, r.width / 11)}px ${css.getPropertyValue("--display")}`;
      ctx.fillText("KAPARJ!", r.width / 2, r.height / 2 - 8);
      ctx.font = `600 15px ${css.getPropertyValue("--body")}`;
      ctx.fillText("Tomi & Ildikó ajándéka", r.width / 2, r.height / 2 + 22);
    }
    const img = wrap.querySelector("img");
    if (img.complete) paint(); else img.addEventListener("load", paint);
    paint();
    const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    function scratch(p) {
      ctx.globalCompositeOperation = "destination-out";
      ctx.lineWidth = 46; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.beginPath(); ctx.moveTo((last || p).x, (last || p).y); ctx.lineTo(p.x, p.y); ctx.stroke();
      last = p;
      if (++moves % 12 === 0) measure();
    }
    function measure() {
      const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
      let clear = 0, total = 0;
      for (let i = 3; i < d.length; i += 64) { total++; if (d[i] < 40) clear++; }
      if (clear / total > 0.5) finish();
    }
    function finish() {
      if (done) return; done = true;
      cv.classList.add("gone"); skip.hidden = true; after.hidden = false;
      store.set(STEPS); renderProgressDone();
      celebrate();
    }
    cv.addEventListener("pointerdown", e => { if (done) return; drawing = true; last = null; cv.setPointerCapture(e.pointerId); scratch(pos(e)); });
    cv.addEventListener("pointermove", e => { if (drawing) scratch(pos(e)); });
    const stop = () => { if (drawing) { drawing = false; measure(); } };
    cv.addEventListener("pointerup", stop); cv.addEventListener("pointercancel", stop);
    card.querySelector("#skip").addEventListener("click", finish);
    window.addEventListener("resize", () => { if (!done) paint(); });
    if (store.get() >= STEPS) finish();
  }
  function renderProgressDone() { progress.querySelectorAll(".bubble").forEach(b => b.className = "bubble done"); }

  /* ---------- confetti ---------- */
  const cc = document.getElementById("confetti"), cx = cc.getContext("2d");
  let parts = [], raf = null;
  function sizeC() { const d = window.devicePixelRatio || 1; cc.width = innerWidth * d; cc.height = innerHeight * d; cx.setTransform(d, 0, 0, d, 0, 0); }
  sizeC(); addEventListener("resize", sizeC);
  function colors() { const s = getComputedStyle(document.documentElement); return ["--coral", "--thermal", "--gold", "--ok"].map(v => s.getPropertyValue(v).trim()); }
  function burst(n, fromTop) {
    if (reduced) return;
    const cols = colors();
    for (let i = 0; i < n; i++) parts.push({
      x: fromTop ? Math.random() * innerWidth : innerWidth / 2, y: fromTop ? -20 - Math.random() * innerHeight * .5 : innerHeight * .45,
      vx: fromTop ? (Math.random() - .5) * 2 : (Math.random() - .5) * 14, vy: fromTop ? 2 + Math.random() * 3 : -6 - Math.random() * 8,
      r: 5 + Math.random() * 6, a: Math.random() * 6, va: (Math.random() - .5) * .3, c: pick(cols), life: 0
    });
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.y < innerHeight + 40 && p.life < 600);
    for (const p of parts) {
      p.vy += .18; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; p.life++;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); cx.restore();
    }
    raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0, 0, innerWidth, innerHeight), null);
  }
  function celebrate() { burst(160, true); setTimeout(() => burst(120, true), 700); setTimeout(() => burst(100), 1400); }

  const VIEWS = [intro, letters, quiz, rebus, when, reveal];
  function render() { renderProgress(); VIEWS[Math.min(step, VIEWS.length - 1)](); }
  document.getElementById("restart").addEventListener("click", () => go(0));
  render();
})();
</script>
